<!doctype html>
<meta charset="utf-8">
<title>dev services</title>
<style>
  body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background:#0f0f0f; color:#edecee; padding:3em 2em; max-width:50em; margin:0 auto; }
  h1 { color:#f693ff; font-weight:500; letter-spacing:.02em; }
  a { color:#8cc8ff; text-decoration:none; }
  a:hover { text-decoration:underline; }
  ul { list-style:none; padding:0; line-height:2; }
  code { color:#6d6d6d; font-size:0.9em; }
</style>
<h1>dev services</h1>
<ul id="services">
  <li><a data-svc="opencode">opencode</a> <code>:9000</code></li>
  <li><a data-svc="vscode">vscode</a> <code>:9001</code></li>
</ul>
<script>
  const suffix = "etarn";
  const port = window.location.port ? ':' + window.location.port : '';
  document.querySelectorAll('[data-svc]').forEach(a => {
    a.href = 'http://' + a.dataset.svc + '.' + suffix + port + '/';
  });
</script>
